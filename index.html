<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Juego</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; font-family: Segoe UI, Arial, sans-serif; }
    button { font-family: inherit; }
    .screen { display: none; min-height: 100%; }
    .screen.on { display: block; }
    .stage { position: relative; width: min(100vw, calc(100vh * 1008 / 1792)); margin: 0 auto; }
    .stage img.art { width: 100%; display: block; }
    .hit { position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 28px; }
    .hit:active { background: rgba(255,255,255,.18); }
    #ajustes {
      display: none; position: fixed; inset: 0; background: rgba(8,12,28,.72);
      z-index: 20; align-items: center; justify-content: center; padding: 20px;
    }
    #ajustes.on { display: flex; }
    .panel {
      width: min(420px, 100%); background: #10203a; color: #fff; border-radius: 18px; padding: 22px;
    }
    .panel h2 { margin: 0 0 14px; }
    .panel input[type=range] { width: 100%; accent-color: #ffd23a; }
    .panel .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .btn {
      border: 0; background: #ffd23a; color: #1b1b1b; font-weight: 700;
      border-radius: 12px; padding: 10px 16px; cursor: pointer;
    }
    #aviso, #fin {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72);
      z-index: 30; align-items: center; justify-content: center; padding: 20px; text-align: center; color: #fff;
    }
    #aviso.on, #fin.on { display: flex; }
    .card { background: #14182a; border-radius: 18px; padding: 22px; width: min(420px, 100%); }
    #nave-screen, #pelota-screen { background: #000; min-height: 100%; }
    canvas { display: block; width: 100%; height: 100vh; touch-action: none; background: #000; }
    #adivina-screen { min-height: 100%; background: linear-gradient(#7fd0ff, #f3b7e4); color: #1b1b1b; padding: 16px; }
    #zoom-box { width: min(520px, 100%); height: 42vh; margin: 8px auto; background: #111; border-radius: 16px; overflow: hidden; }
    #zoom-box canvas { width: 100%; height: 100%; }
    .opciones { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; max-width: 860px; margin: 12px auto; }
    .opciones button { width: 28%; min-width: 110px; border: 3px solid transparent; border-radius: 14px; padding: 0; background: #fff; cursor: pointer; overflow: hidden; }
    .opciones img { width: 100%; height: 140px; object-fit: cover; display: block; }
    .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 860px; margin: 0 auto 8px; }
    .marca { position: fixed; left: 10px; bottom: 10px; z-index: 5; }
  </style>
</head>
<body>
  <section id="inicio" class="screen on">
    <div class="stage">
      <img class="art" src="inicio.jpg" alt="Inicio">
      <button class="hit" id="btn-jugar" aria-label="Jugar" style="left:59.5%;top:35.4%;width:39.3%;height:12.4%"></button>
      <button class="hit" id="btn-ajustes" aria-label="Ajustes" style="left:61.5%;top:50.6%;width:35.1%;height:11.4%"></button>
    </div>
  </section>

  <section id="menu" class="screen">
    <div class="stage">
      <img class="art" src="img/menu.jpg" alt="Menú principal">
      <button class="hit" id="btn-nave" aria-label="Nave espacial" style="left:18.2%;top:28.8%;width:70.2%;height:14.7%"></button>
      <button class="hit" id="btn-pelota" aria-label="Pelota saltarina" style="left:18.2%;top:45.5%;width:70.2%;height:14.8%"></button>
      <button class="hit" id="btn-foto" aria-label="Adivina la foto" style="left:18.2%;top:62.3%;width:70.2%;height:14.7%"></button>
    </div>
    <button class="btn marca" id="volver-inicio" type="button">Inicio</button>
  </section>

  <section id="nave-screen" class="screen">
    <canvas id="nave-canvas"></canvas>
  </section>

  <section id="pelota-screen" class="screen">
    <canvas id="pelota-canvas"></canvas>
  </section>

  <section id="adivina-screen" class="screen">
    <div class="topbar">
      <button class="btn" id="volver-menu-foto" type="button">Menú</button>
      <strong id="foto-score">Puntos 0</strong>
    </div>
    <div id="zoom-box"><canvas id="zoom-canvas"></canvas></div>
    <p id="foto-msg" style="text-align:center;font-weight:700;min-height:1.4em"></p>
    <div class="opciones" id="opciones"></div>
  </section>

  <div id="ajustes">
    <div class="panel">
      <h2>Ajustes</h2>
      <div class="row"><span>Sonido</span><span id="vol-label">80%</span></div>
      <input id="vol" type="range" min="0" max="100" value="80">
      <button class="btn" id="cerrar-ajustes" type="button" style="margin-top:16px">Cerrar</button>
    </div>
  </div>

  <div id="aviso">
    <div class="card">
      <h2>Gira el móvil</h2>
      <p>Este juego se juega en horizontal. Las flechas mueven la nave arriba y abajo. El corazón dispara.</p>
      <button class="btn" id="aviso-ok" type="button">Jugar</button>
    </div>
  </div>

  <div id="fin">
    <div class="card">
      <h2 id="fin-titulo">Fin</h2>
      <p id="fin-texto"></p>
      <button class="btn" id="fin-reintentar" type="button">Otra vez</button>
      <button class="btn" id="fin-menu" type="button">Menú</button>
    </div>
  </div>

  <script>
    var volumen = Number(localStorage.getItem("juego-vol") || 80) / 100;
    var audioCtx = null;
    var fotos = ["01","02","03","04","05","06","07","08","09","10","11","12","13"].map(function (n) { return "img/adivina/" + n + ".jpeg"; });
    var naveImg = new Image(); naveImg.src = "img/nave.png";
    var chicaImg = new Image(); chicaImg.src = "img/chica.png";
    var pelotaImg = new Image(); pelotaImg.src = "img/pelota.png";

    function pop() {
      if (volumen <= 0) return;
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(680, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.12);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.45 * volumen, audioCtx.currentTime + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.16);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.17);
    }

    function show(id) {
      document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("on"); });
      document.getElementById(id).classList.add("on");
    }

    document.getElementById("vol").value = Math.round(volumen * 100);
    document.getElementById("vol-label").textContent = Math.round(volumen * 100) + "%";
    document.getElementById("vol").addEventListener("input", function () {
      volumen = Number(this.value) / 100;
      localStorage.setItem("juego-vol", this.value);
      document.getElementById("vol-label").textContent = this.value + "%";
    });

    document.getElementById("btn-jugar").onclick = function () { pop(); show("menu"); };
    document.getElementById("btn-ajustes").onclick = function () { pop(); document.getElementById("ajustes").classList.add("on"); };
    document.getElementById("cerrar-ajustes").onclick = function () { pop(); document.getElementById("ajustes").classList.remove("on"); };
    document.getElementById("volver-inicio").onclick = function () { pop(); show("inicio"); };
    document.getElementById("btn-nave").onclick = function () { pop(); document.getElementById("aviso").classList.add("on"); };
    document.getElementById("aviso-ok").onclick = function () { pop(); document.getElementById("aviso").classList.remove("on"); startNave(); };
    document.getElementById("btn-pelota").onclick = function () { pop(); startPelota(); };
    document.getElementById("btn-foto").onclick = function () { pop(); startFoto(); };
    document.getElementById("volver-menu-foto").onclick = function () { pop(); show("menu"); };
    document.getElementById("fin-menu").onclick = function () { pop(); stopLoops(); document.getElementById("fin").classList.remove("on"); show("menu"); };
    document.getElementById("fin-reintentar").onclick = function () {
      pop();
      document.getElementById("fin").classList.remove("on");
      if (finModo === "nave") startNave();
      else startPelota();
    };

    var finModo = "nave";
    var naveOn = false, pelotaOn = false;
    function stopLoops() { naveOn = false; pelotaOn = false; }
    function fin(modo, titulo, texto) {
      finModo = modo;
      stopLoops();
      document.getElementById("fin-titulo").textContent = titulo;
      document.getElementById("fin-texto").textContent = texto;
      document.getElementById("fin").classList.add("on");
    }

    var keys = {};
    document.addEventListener("keydown", function (e) { keys[e.key] = true; });
    document.addEventListener("keyup", function (e) { keys[e.key] = false; });

    function startNave() {
      show("nave-screen");
      var canvas = document.getElementById("nave-canvas");
      var ctx = canvas.getContext("2d");
      var hearts = [], love = 0, dead = false, tick = 0, shotCd = 0, enemyCd = 40;
      var ship = { y: 0.45 };
      var hold = { up: false, down: false, fire: false };
      naveOn = true;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.onresize = resize;

      function shoot() {
        if (shotCd > 0 || dead) return;
        shotCd = 18;
        var h = canvas.height, w = canvas.width;
        hearts.push({ x: w * 0.16, y: ship.y * h, vx: 7, kind: "pink" });
      }

      canvas.onpointerdown = function (e) {
        var r = canvas.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        if (x < 0.16 && y > 0.72) hold.up = true;
        else if (x < 0.32 && y > 0.72) hold.down = true;
        else if (x > 0.78 && y > 0.7) { hold.fire = true; shoot(); }
      };
      canvas.onpointerup = canvas.onpointerleave = function () { hold.up = hold.down = hold.fire = false; };

      function loop() {
        if (!naveOn) return;
        var w = canvas.width, h = canvas.height;
        tick++;
        if ((hold.up || keys.ArrowUp) && ship.y > 0.18) ship.y -= 0.008;
        if ((hold.down || keys.ArrowDown) && ship.y < 0.78) ship.y += 0.008;
        if ((hold.fire || keys[" "]) ) shoot();
        if (shotCd > 0) shotCd--;
        enemyCd--;
        if (enemyCd <= 0 && !dead) {
          enemyCd = 55;
          hearts.push({ x: w * 0.78, y: h * 0.42, vx: -5.2, kind: "blue" });
        }
        hearts.forEach(function (hr) { hr.x += hr.vx; });
        hearts = hearts.filter(function (hr) {
          if (hr.kind === "pink" && hr.x > w * 0.72) { love = Math.min(100, love + 8); return false; }
          if (hr.kind === "blue" && Math.abs(hr.x - w * 0.12) < 28 && Math.abs(hr.y - ship.y * h) < 34) { dead = true; return false; }
          return hr.x > -20 && hr.x < w + 20;
        });
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#9aa";
        for (var i = 0; i < 50; i++) ctx.fillRect((i * 97) % w, (i * 53) % h, 2, 2);
        if (chicaImg.complete) ctx.drawImage(chicaImg, w * 0.52, h * 0.12, w * 0.46, h * 0.86);
        if (naveImg.complete) ctx.drawImage(naveImg, w * 0.06, ship.y * h - 36, 90, 60);
        hearts.forEach(function (hr) {
          ctx.font = "28px serif";
          ctx.fillText(hr.kind === "pink" ? "❤" : "💙", hr.x, hr.y);
        });
        ctx.strokeStyle = "#ddd";
        ctx.strokeRect(w * 0.18, 24, w * 0.64, 54);
        ctx.fillStyle = "#ff4d88";
        ctx.fillRect(w * 0.18 + 4, 28, (w * 0.64 - 8) * (love / 100), 46);
        ctx.fillStyle = "#fff";
        ctx.font = "22px monospace";
        ctx.textAlign = "center";
        ctx.fillText("barra de amor", w / 2, 58);
        ctx.textAlign = "left";
        function pad(x, y) {
          ctx.fillStyle = "#111";
          ctx.strokeStyle = "#ddd";
          ctx.fillRect(x, y, 74, 74);
          ctx.strokeRect(x, y, 74, 74);
        }
        pad(24, h - 110); pad(114, h - 110); pad(w - 110, h - 116);
        ctx.fillStyle = "#fff";
        ctx.font = "40px sans-serif";
        ctx.fillText("↑", 42, h - 60);
        ctx.fillText("↓", 132, h - 60);
        ctx.fillText("❤", w - 88, h - 62);
        if (love >= 100) { fin("nave", "Barra llena", "La barra de amor está al máximo."); return; }
        if (dead) { fin("nave", "Nave destruida", "Un corazón azul te ha dado."); return; }
        requestAnimationFrame(loop);
      }
      loop();
    }

    function startPelota() {
      show("pelota-screen");
      var canvas = document.getElementById("pelota-canvas");
      var ctx = canvas.getContext("2d");
      pelotaOn = true;
      var cam = 0, score = 0, ball, plats;
      function reset() {
        var w = canvas.width || 360;
        cam = 0; score = 0;
        ball = { x: w / 2, y: 400, vx: 0, vy: -8, r: 28 };
        plats = [];
        for (var i = 0; i < 8; i++) plats.push({ x: 20 + Math.random() * (w - 120), y: 520 - i * 110, w: 90 });
      }
      reset();
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize();
      window.onresize = resize;
      canvas.onpointerdown = function (e) {
        var r = canvas.getBoundingClientRect();
        ball.vx += (e.clientX - r.left) < r.width / 2 ? -3.2 : 3.2;
      };
      function loop() {
        if (!pelotaOn) return;
        var w = canvas.width, h = canvas.height;
        ball.vy += 0.28;
        ball.vx *= 0.98;
        ball.x += ball.vx;
        ball.y += ball.vy;
        if (ball.x < -ball.r) ball.x = w + ball.r;
        if (ball.x > w + ball.r) ball.x = -ball.r;
        plats.forEach(function (p) {
          if (ball.vy > 0 && ball.x > p.x && ball.x < p.x + p.w && ball.y + ball.r > p.y && ball.y + ball.r < p.y + 16) {
            ball.vy = -10.5;
            ball.y = p.y - ball.r;
          }
        });
        var target = ball.y - h * 0.45;
        if (target < cam) cam += (target - cam) * 0.12;
        plats.forEach(function (p) { if (p.y - cam > h + 40) { p.y -= 900; p.x = 20 + Math.random() * (w - 120); score++; } });
        ctx.fillStyle = "#87d6ff";
        ctx.fillRect(0, 0, w, h);
        plats.forEach(function (p) {
          ctx.fillStyle = "#5a3";
          ctx.fillRect(p.x, p.y - cam, p.w, 14);
        });
        if (pelotaImg.complete) ctx.drawImage(pelotaImg, ball.x - ball.r, ball.y - cam - ball.r, ball.r * 2, ball.r * 2);
        ctx.fillStyle = "#142";
        ctx.font = "28px Segoe UI, Arial";
        ctx.fillText("Puntos " + score, 16, 40);
        if (ball.y - cam > h + 80) { fin("pelota", "Te has caído", "Puntos: " + score); return; }
        requestAnimationFrame(loop);
      }
      loop();
    }

    var fotoScore = 0, fotoLock = false, correcta = "";
    function startFoto() {
      fotoScore = 0;
      show("adivina-screen");
      document.getElementById("foto-score").textContent = "Puntos 0";
      rondaFoto();
    }
    function rondaFoto() {
      fotoLock = false;
      document.getElementById("foto-msg").textContent = "¿De qué foto es este trozo?";
      var orden = fotos.slice().sort(function () { return Math.random() - 0.5; });
      correcta = orden[0];
      var opciones = orden.slice(0, 3).sort(function () { return Math.random() - 0.5; });
      var img = new Image();
      img.onload = function () {
        var z = document.getElementById("zoom-canvas");
        z.width = 800; z.height = 500;
        var c = z.getContext("2d");
        var sw = img.width * 0.22, sh = img.height * 0.22;
        var sx = img.width * (0.2 + Math.random() * 0.5);
        var sy = img.height * (0.2 + Math.random() * 0.5);
        c.drawImage(img, sx, sy, sw, sh, 0, 0, z.width, z.height);
      };
      img.src = correcta;
      var box = document.getElementById("opciones");
      box.innerHTML = "";
      opciones.forEach(function (src) {
        var b = document.createElement("button");
        b.innerHTML = "<img alt='opción' src='" + src + "'>";
        b.onclick = function () {
          if (fotoLock) return;
          fotoLock = true;
          pop();
          if (src === correcta) {
            fotoScore++;
            document.getElementById("foto-score").textContent = "Puntos " + fotoScore;
            document.getElementById("foto-msg").textContent = "Correcta";
          } else document.getElementById("foto-msg").textContent = "Incorrecta";
          setTimeout(rondaFoto, 800);
        };
        box.appendChild(b);
      });
    }
  </script>
</body>
</html>
